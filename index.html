<body>
    <h1>Looping Through Arrays</h1>

    <script>
        let cars = ["Toyota", "Honda", "Ford", "BMW", "nissan",]
        console.log(cars)
        // console.log(cars[0])
        // console.log(cars[1])
        // console.log(cars[2])
        // console.log(cars[3])
        //D.R.Y. principle Don't Repeat Yourself

        // for (let i=0; i<cars.length; i++){
        //     console.log(cars[i])
        // }

        // let j = 0;
        // while (j<cars.length){
        //     console.log(cars[j]);
        //     j++;

        //push
        cars.push("Ferrari")
        console.log(cars)
        //pop
        cars.pop()
        console.log(cars)
        //shift
        cars.shift()
        console.log(cars)
        //unshift
        cars.unshift("Tesla")
        console.log(cars)

        //2D array =    multi-dimensional array that stores a matrix
        //              of data in rows and columns
        //              Usefule for games, spreadsheets, or representing images

        const matrix = [[1, 2, 3], 
                        [4, 5, 6], 
                        [7, 8, 9],
                        ['*', 0, '#']];

        // matrix[0][0] = 'X';
        // matrix[0][1] = 'O';
        // matrix[0][2] = 'X';

        // matrix[1][0] = 'O';
        // matrix[1][1] = 'X';
        // matrix[1][2] = 'O';

        // matrix[2][0] = 'X';
        // matrix[2][1] = 'O';
        // matrix[2][2] = 'X';

        for(let row of matrix){
            const rowString = row.join(' ');
            console.log(rowString);
        }
    </script>
